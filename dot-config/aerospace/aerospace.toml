# Place a copy of this config to ~/.aerospace.toml
# After that, you can edit ~/.aerospace.toml to your liking

# Config version for compatibility and deprecations
# Fallback value (if you omit the key): config-version = 1
config-version = 2

# You can use it to add commands that run after AeroSpace startup.
# Available commands : https://nikitabobko.github.io/AeroSpace/commands
after-startup-command = [
  'exec-and-forget borders active_color=0xff9184ee inactive_color=0xff494d64 width=5.0 hidpi=on'
]

# Start AeroSpace at login
start-at-login = true

# Normalizations. See: https://nikitabobko.github.io/AeroSpace/guide#normalization
enable-normalization-flatten-containers = false
enable-normalization-opposite-orientation-for-nested-containers = true

# See: https://nikitabobko.github.io/AeroSpace/guide#layouts
# The 'accordion-padding' specifies the size of accordion padding
# You can set 0 to disable the padding feature
accordion-padding = 30

# Possible values: tiles|accordion
default-root-container-layout = 'tiles'

# Possible values: horizontal|vertical|auto
# 'auto' means: wide monitor (anything wider than high) gets horizontal orientation,
#               tall monitor (anything higher than wide) gets vertical orientation
default-root-container-orientation = 'auto'

# Mouse follows focus when focused monitor changes
# Drop it from your config, if you don't like this behavior
# See https://nikitabobko.github.io/AeroSpace/guide#on-focus-changed-callbacks
# See https://nikitabobko.github.io/AeroSpace/commands#move-mouse
# Fallback value (if you omit the key): on-focused-monitor-changed = []
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']
on-focus-changed = ['move-mouse window-lazy-center']

# You can effectively turn off macOS "Hide application" (cmd-h) feature by toggling this flag
# Useful if you don't use this macOS feature, but accidentally hit cmd-h or cmd-alt-h key
# Also see: https://nikitabobko.github.io/AeroSpace/goodies#disable-hide-app
automatically-unhide-macos-hidden-apps = false

# List of workspaces that should stay alive even when they contain no windows,
# even when they are invisible.
# This config version is only available since 'config-version = 2'
# Fallback value (if you omit the key): persistent-workspaces = []
persistent-workspaces = ["1", "2", "3", "4", "5", "6", "B", "T", "C", "S", "M", "O", "N"]

# A callback that runs every time binding mode changes
# See: https://nikitabobko.github.io/AeroSpace/guide#binding-modes
# See: https://nikitabobko.github.io/AeroSpace/commands#mode
on-mode-changed = []

# Possible values: (qwerty|dvorak|colemak)
# See https://nikitabobko.github.io/AeroSpace/guide#key-mapping
[key-mapping]
    preset = 'qwerty'

# Gaps between windows (inner-*) and between monitor edges (outer-*).
# Possible values:
# - Constant:     gaps.outer.top = 8
# - Per monitor:  gaps.outer.top = [{ monitor.main = 16 }, { monitor."some-pattern" = 32 }, 24]
#                 In this example, 24 is a default value when there is no match.
#                 Monitor pattern is the same as for 'workspace-to-monitor-force-assignment'.
#                 See:
#                 https://nikitabobko.github.io/AeroSpace/guide#assign-workspaces-to-monitors
[gaps]
    inner.horizontal = 10
    inner.vertical =   10
    outer.left =       10
    outer.bottom =     10
    outer.top =        5
    outer.right =      10

# 'main' binding mode declaration
# See: https://nikitabobko.github.io/AeroSpace/guide#binding-modes
# 'main' binding mode must be always presented
# Fallback value (if you omit the key): mode.main.binding = {}
[mode.main.binding]

    # All possible keys:
    # - Letters.        a, b, c, ..., z
    # - Numbers.        0, 1, 2, ..., 9
    # - Keypad numbers. keypad0, keypad1, keypad2, ..., keypad9
    # - F-keys.         f1, f2, ..., f20
    # - Special keys.   minus, equal, period, comma, slash, backslash, quote, semicolon,
    #                   backtick, leftSquareBracket, rightSquareBracket, space, enter, esc,
    #                   backspace, tab, pageUp, pageDown, home, end, forwardDelete,
    #                   sectionSign (ISO keyboards only, european keyboards only)
    # - Keypad special. keypadClear, keypadDecimalMark, keypadDivide, keypadEnter, keypadEqual,
    #                   keypadMinus, keypadMultiply, keypadPlus
    # - Arrows.         left, down, up, right

    # All possible modifiers: cmd, alt, ctrl, shift

    # All possible commands: https://nikitabobko.github.io/AeroSpace/commands

    # See: https://nikitabobko.github.io/AeroSpace/commands#exec-and-forget
    # You can uncomment the following lines to open up terminal with alt + enter shortcut
    # (like in i3)
    # alt-a = 'exec-and-forget open -a /Applications/Arc.app'
    alt-enter = 'exec-and-forget open -a /Applications/Ghostty.app/'
    # alt-s = 'exec-and-forget open -a /Applications/Slack.app/'
    # alt-v = 'exec-and-forget open -a "/Applications/Visual Studio Code.app/"'
    # alt-o = 'exec-and-forget open -a "/Applications/Microsoft Outlook.app/"'
    # alt-m = 'exec-and-forget open -a /Applications/Spotify.app'

    # Open Spotlight clipboard history with Shift+Option+C.
    alt-cmd-c = """exec-and-forget /usr/bin/osascript -l JavaScript -e 'ObjC.import("CoreGraphics");
var source = $.CGEventSourceCreate(-1);
function commandKey(code) { 
    [true, false].forEach(function(down) {
        var event = $.CGEventCreateKeyboardEvent(source, code, down);
        $.CGEventSetFlags(event, 1048576);
        $.CGEventPost(0, event);
    });
}
commandKey(49);
delay(0.3);
commandKey(21);'"""

    # See: https://nikitabobko.github.io/AeroSpace/commands#layout

    alt-f = 'fullscreen'
    alt-space = 'layout floating tiling'
    alt-t = [
    'fullscreen off',
    'layout tiling tiles horizontal vertical',
    ]


    # Not used, prefer split commands
    # See: https://nikitabobko.github.io/AeroSpace/commands#join-with 
    # alt-a = 'join-with left'
    # alt-s = 'join-with down'
    # alt-d = 'join-with up'
    # alt-f = 'join-with right'

    # See: https://nikitabobko.github.io/AeroSpace/commands#split
    alt-v = 'split vertical'
    shift-alt-v = 'split horizontal'


    shift-alt-r = 'flatten-workspace-tree' # Reset
    shift-alt-c = 'reload-config' 
 
    # See: https://nikitabobko.github.io/AeroSpace/commands#focus
    alt-h = 'focus left'
    alt-j = 'focus down'
    alt-k = 'focus up'
    alt-l = 'focus right'

    # See: https://nikitabobko.github.io/AeroSpace/commands#move
    alt-shift-h = 'move left'
    alt-shift-j = 'move down'
    alt-shift-k = 'move up'
    alt-shift-l = 'move right'

    # See: https://nikitabobko.github.io/AeroSpace/commands#resize
    alt-minus = 'resize smart -50' # alt-+ in Norwegian
    alt-slash = 'resize smart +50' # alt-- in Norwegian

    # See: https://nikitabobko.github.io/AeroSpace/commands#workspace
    ctrl-alt-cmd-1 = 'workspace 1'
    ctrl-alt-cmd-2 = 'workspace 2'
    ctrl-alt-cmd-3 = 'workspace 3'
    ctrl-alt-cmd-4 = 'workspace 4'
    ctrl-alt-cmd-5 = 'workspace 5'
    ctrl-alt-cmd-6 = 'workspace 6'
    ctrl-alt-cmd-b = 'workspace B'
    ctrl-alt-cmd-t = 'workspace T'
    ctrl-alt-cmd-c = 'workspace C'
    ctrl-alt-cmd-s = 'workspace S'
    ctrl-alt-cmd-m = 'workspace M'
    ctrl-alt-cmd-o = 'workspace O'
    ctrl-alt-cmd-n = 'workspace N'
    

    # See: https://nikitabobko.github.io/AeroSpace/commands#move-node-to-workspace
    shift-ctrl-alt-cmd-1 = 'move-node-to-workspace --focus-follows-window 1'
    shift-ctrl-alt-cmd-2 = 'move-node-to-workspace --focus-follows-window 2'
    shift-ctrl-alt-cmd-3 = 'move-node-to-workspace --focus-follows-window 3'
    shift-ctrl-alt-cmd-4 = 'move-node-to-workspace --focus-follows-window 4'
    shift-ctrl-alt-cmd-5 = 'move-node-to-workspace --focus-follows-window 5'
    shift-ctrl-alt-cmd-6 = 'move-node-to-workspace --focus-follows-window 6'
    shift-ctrl-alt-cmd-b = 'move-node-to-workspace --focus-follows-window B'
    shift-ctrl-alt-cmd-t = 'move-node-to-workspace --focus-follows-window T'
    shift-ctrl-alt-cmd-c = 'move-node-to-workspace --focus-follows-window C'
    shift-ctrl-alt-cmd-s = 'move-node-to-workspace --focus-follows-window S'
    shift-ctrl-alt-cmd-m = 'move-node-to-workspace --focus-follows-window M'
    shift-ctrl-alt-cmd-o = 'move-node-to-workspace --focus-follows-window O'
    shift-ctrl-alt-cmd-n = 'move-node-to-workspace --focus-follows-window N'


    # See: https://nikitabobko.github.io/AeroSpace/commands#workspace-back-and-forth
    alt-tab = 'workspace-back-and-forth'
    # See: https://nikitabobko.github.io/AeroSpace/commands#move-workspace-to-monitor
    alt-shift-tab = 'move-workspace-to-monitor --wrap-around next'

    # See: https://nikitabobko.github.io/AeroSpace/commands#mode
    alt-shift-semicolon = 'mode service' # alt-shift-ø in Norwegian

# 'service' binding mode declaration.
# See: https://nikitabobko.github.io/AeroSpace/guide#binding-modes
[mode.service.binding]
    backspace = ['close-all-windows-but-current', 'mode main']

    # sticky is not yet supported https://github.com/nikitabobko/AeroSpace/issues/2
    #s = ['layout sticky tiling', 'mode main']

# Configure apps that float by default
[[on-window-detected]]
if.app-name-regex-substring = 'finder'
run = 'layout floating'

[[on-window-detected]]
if.app-name-regex-substring = 'cisco secure client'
run = 'layout floating'

[[on-window-detected]]
if.app-name-regex-substring = 'messages'
run = 'layout floating'

[[on-window-detected]]
if.app-name-regex-substring = 'passwords'
run = 'layout floating'

[[on-window-detected]]
if.app-name-regex-substring = 'zoom'
run = 'layout floating'

[[on-window-detected]]
if.app-name-regex-substring = 'calendar'
run = 'layout floating'

[[on-window-detected]]
if.app-name-regex-substring = 'spotify'
run = "move-node-to-workspace --focus-follows-window M"

[[on-window-detected]]
if.app-name-regex-substring = 'slack'
run = "move-node-to-workspace --focus-follows-window S"

[[on-window-detected]]
if.app-name-regex-substring = 'outlook'
run = "move-node-to-workspace --focus-follows-window O"

[[on-window-detected]]
if.app-name-regex-substring = 'notion'
run = "move-node-to-workspace --focus-follows-window N"

